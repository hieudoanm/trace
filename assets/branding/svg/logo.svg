<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <!-- Mask: white = keep visible, black = cut out (transparent) -->
    <mask id="mouths" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="400">
      <rect x="0" y="0" width="400" height="400" fill="#fff"/>
      <!-- Top -->
      <rect x="190" y="90"  width="20" height="70" fill="#000"/>
      <!-- Bottom -->
      <rect x="190" y="240" width="20" height="70" fill="#000"/>
      <!-- Left -->
      <rect x="90"  y="190" width="70" height="20" fill="#000"/>
      <!-- Right -->
      <rect x="240" y="190" width="70" height="20" fill="#000"/>
    </mask>
  </defs>

  <!-- White notebook square -->
  <rect x="20" y="20" width="360" height="360" fill="#ffffff" stroke="#333333" stroke-width="2"/>

  <!-- Grid lines -->
  <g stroke="#c9d6e3" stroke-width="1">
    <line x1="44"  y1="20" x2="44"  y2="380"/>
    <line x1="68"  y1="20" x2="68"  y2="380"/>
    <line x1="92"  y1="20" x2="92"  y2="380"/>
    <line x1="116" y1="20" x2="116" y2="380"/>
    <line x1="140" y1="20" x2="140" y2="380"/>
    <line x1="164" y1="20" x2="164" y2="380"/>
    <line x1="188" y1="20" x2="188" y2="380"/>
    <line x1="212" y1="20" x2="212" y2="380"/>
    <line x1="236" y1="20" x2="236" y2="380"/>
    <line x1="260" y1="20" x2="260" y2="380"/>
    <line x1="284" y1="20" x2="284" y2="380"/>
    <line x1="308" y1="20" x2="308" y2="380"/>
    <line x1="332" y1="20" x2="332" y2="380"/>
    <line x1="356" y1="20" x2="356" y2="380"/>

    <line x1="20" y1="44"  x2="380" y2="44"/>
    <line x1="20" y1="68"  x2="380" y2="68"/>
    <line x1="20" y1="92"  x2="380" y2="92"/>
    <line x1="20" y1="116" x2="380" y2="116"/>
    <line x1="20" y1="140" x2="380" y2="140"/>
    <line x1="20" y1="164" x2="380" y2="164"/>
    <line x1="20" y1="188" x2="380" y2="188"/>
    <line x1="20" y1="212" x2="380" y2="212"/>
    <line x1="20" y1="236" x2="380" y2="236"/>
    <line x1="20" y1="260" x2="380" y2="260"/>
    <line x1="20" y1="284" x2="380" y2="284"/>
    <line x1="20" y1="308" x2="380" y2="308"/>
    <line x1="20" y1="332" x2="380" y2="332"/>
    <line x1="20" y1="356" x2="380" y2="356"/>
  </g>

  <!-- Hollow columns: sides now run into the ring and end hidden under it -->
  <g fill="none" stroke="#2b3a55" stroke-width="16" stroke-linejoin="round">
    <path d="M 182 140 L 182 82  A 18 18 0 0 1 218 82  L 218 140"/>
    <path d="M 182 260 L 182 318 A 18 18 0 0 0 218 318 L 218 260"/>
    <path d="M 140 182 L 82 182  A 18 18 0 0 0 82 218  L 140 218"/>
    <path d="M 260 182 L 318 182 A 18 18 0 0 1 318 218 L 260 218"/>
  </g>

  <!-- Ring only, no fill — grid shows through. Mouths masked open. -->
  <circle cx="200" cy="200" r="60"
          fill="none" stroke="#2b3a55" stroke-width="16"
          mask="url(#mouths)"/>
</svg>