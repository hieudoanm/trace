repos:
  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
      - id: cargo-check
      - id: clippy
        args: [--all-targets, --, -D, warnings]

  - repo: local
    hooks:
      - id: tracers-scan
        name: tracers scan
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && (./target/release/tracers scan . || ./target/debug/tracers scan .)'
        language: system
        pass_filenames: false

      - id: docsify
        name: docsify graph outputs
        entry: bash scripts/docsify.sh
        language: system
        pass_filenames: false
        stages: [commit]
