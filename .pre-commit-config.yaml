repos:
  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
      - id: cargo-check
      - id: clippy

  - repo: local
    hooks:
      - id: trace-check
        name: trace check
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && (./target/release/trace check . || ./target/debug/trace check .)'
        language: system
        pass_filenames: false
