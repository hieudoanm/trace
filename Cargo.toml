[workspace]
resolver = "2"
members = [
    "crates/trace-core",
    "crates/trace-parser",
    "crates/trace-analysis",
    "crates/trace-export",
    "crates/trace-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/hieudoanm/trace"

[workspace.dependencies]
anyhow = "=1.0.104"
blake3 = "=1.8.7"
clap = { version = "=4.6.7", features = ["derive"] }
globset = "=0.4.21"
ignore = "=0.4.34"
insta = { version = "=1.49.0", features = ["json"] }
petgraph = "=0.8.3"
rayon = "=1.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
toml = "=1.1.8"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
tree-sitter = "=0.27.1"
tree-sitter-c = "0.24"
tree-sitter-cpp = "=0.23.4"
tree-sitter-dart = "=0.0.4"
tree-sitter-go = "=0.25.0"
tree-sitter-javascript = "=0.25.0"
tree-sitter-kt = "=0.1.0"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-swift = "=0.7.4"
tree-sitter-typescript = "=0.23.2"
tree-sitter-java = "=0.23.5"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-php = "=0.25.1"
tree-sitter-ruby = "=0.23.1"
tree-sitter-scala = "=0.24.0"
tree-sitter-r = "=1.2.0"

[profile.release]
lto = "thin"
codegen-units = 1
