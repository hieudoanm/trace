[workspace]
resolver = "2"
members = [
    "crates/trace-core",
    "crates/trace-parser",
    "crates/trace-analysis",
    "crates/trace-export",
    "crates/trace-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/hieudoanm/trace"

[workspace.dependencies]
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
insta = { version = "1.42", features = ["json"] }
petgraph = "0.8"
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.27.1"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-kt = "0.1.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-swift = "0.7.4"
tree-sitter-typescript = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-c-sharp = "0.23.1"
tree-sitter-php = "0.23.11"
tree-sitter-ruby = "0.23.1"

[profile.release]
lto = "thin"
codegen-units = 1
