name: docs

# Regenerates the docs/ graph explorer after every push to master.
# docs/ is fully generated output, so it is produced here instead of in
# pre-commit — a hook cannot include its own modifications in the commit
# that triggered it.
on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build tracers
        run: cargo build --release -p tracers-cli

      - name: Scan repository
        run: ./target/release/tracers scan .

      - name: Copy graph outputs to docs/
        run: bash scripts/docsify.sh

      - name: Commit regenerated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "docs unchanged"
          else
            git commit -m "Update docs graph"
            git push
          fi
